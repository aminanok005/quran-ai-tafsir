name: Merge branch pushes into main

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: write

jobs:
  merge:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge pushed commit into main
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main origin/main

            if git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
              echo "Pushed commit is already included in main."
              exit 0
            fi

            git merge --no-ff --no-edit "$SOURCE_SHA"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main advanced during the push; retrying merge ($attempt/5)." >&2
          done

          echo "Unable to update main after 5 attempts." >&2
          exit 1
