version: '3.8'

services:
  db:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quran_ai}
      POSTGRES_USER: ${POSTGRES_USER:-quran_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quran_ai_dev}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./services
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for live reload
      - ./services/api:/app
      # Mount local Python packages to avoid reinstalls
      - ~/.local/share/uv:/root/.cache/uv
    environment:
      - DEBUG=true
      - ENVIRONMENT=development
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-quran_ai}:${POSTGRES_PASSWORD:-quran_ai_dev}@db:5432/${POSTGRES_DB:-quran_ai}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    build:
      context: ./apps
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for live reload
      - ./apps/web:/app
      # Mount node_modules to avoid reinstalls
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_TELEMETRY_DISABLED=true
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfilename appendonly.aof

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  node_modules:
    driver: local