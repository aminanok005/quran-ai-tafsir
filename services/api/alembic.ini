# Alembic configuration for QURAN AI API service

[alembic]
# Path to migration scripts
script_location = %(here)s/migrations

# Template for new migrations
file_template = %%(rev)s_%%(slug)s

# Timezone
timezone = UTC

# Output encoding
output_encoding = utf-8

# PostgreSQL connection
sqlalchemy.url = driver://user:password@host:port/database

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S